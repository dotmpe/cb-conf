VM_NAME="cb-headless"
VM_ARCH="x86_64"
VM_SEED="debian-13"
VM_CPUS=2
VM_MEMORY="2G"
VM_DISK_SIZE="20G"
VM_EPHEMERAL=1

# Network & SSH port forwarding
VM_NET_MODE="user"
declare -ga VM_PORT_FORWARDS=(
  "tcp::2222-:22"
)

# name:host:guest:mode
# The rw share stays outside the repo so the two exports do not alias inodes.
# ${VM_CACHE_DIR} is set by config/vm/seeds.conf before this file is sourced.
VM_SHARE="9p"
declare -ga VM_MOUNTS=(
  "repo:${PWD}:/mnt/cb-conf:ro"
  "work:${VM_CACHE_DIR}/work/${VM_NAME}:/mnt/work:rw"
)
VM_GIT_URL="/mnt/cb-conf"
VM_GIT_DEST="/mnt/work/cb-conf"
VM_BOOTSTRAP="/mnt/cb-conf/config/vm/guest/debian/bootstrap"

# Headless console
VM_DISPLAY="none"
VM_VGA="none"
VM_SERIAL="mon:stdio"

# Local NoCloud seed. compose builds the cidata disk and mounts the shares.
VM_PROVISION="cidata"
VM_CLOUD_DIR="${PWD}/config/vm/guest/debian"

