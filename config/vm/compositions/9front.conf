VM_NAME="plan9-9front"
VM_ARCH="x86_64"
VM_SEED="9front"
VM_DRIVE_IF="ide"
VM_CPUS=2
VM_MEMORY="1G"
VM_DISK_SIZE="10G"
VM_EPHEMERAL=1
VM_USB_TABLET=1

# Native Plan 9 display and serial
VM_DISPLAY="gtk"
VM_VGA="std"
VM_SERIAL="mon:stdio"

# Network & Plan 9 exportfs port.
# The shares themselves are dialed at 10.0.2.2 (QEMU user-net), not hostfwd.
VM_NET_MODE="user"
declare -ga VM_PORT_FORWARDS=(
  "tcp::17010-:17010"
)

# name:host:guest:mode
# Stock 9front has no virtio-9p client, and diod speaks only 9P2000.L.
# VM_SHARE=u9fs starts a 9P2000 server the guest dials.
# The rw share stays outside the repo so the exports do not overlap.
VM_SHARE="u9fs"
VM_SHARE_PORT="15640"
declare -ga VM_MOUNTS=(
  "repo:${PWD}:/n/cb-conf:ro"
  "work:${VM_CACHE_DIR}/work/${VM_NAME}:/n/work:rw"
)
VM_GIT_URL="/n/cb-conf"
VM_GIT_DEST="/n/work/cb-conf"
VM_BOOTSTRAP="/n/cb-conf/config/vm/guest/9front/bootstrap.rc"

# 9660 config disc. compose builds it; the guest sources /n/cfg/startup.rc.
VM_PROVISION="iso9660"
VM_BOOTSTRAP_DIR="${PWD}/config/vm/guest/9front"

