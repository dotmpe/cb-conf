VM_NAME="blboron-desktop"
VM_ARCH="x86_64"
VM_ISO="blboron-1"
VM_BOOT_CDROM=1
VM_CPUS=2
VM_MEMORY="2G"
VM_DISK_SIZE="20G"
VM_EPHEMERAL=1

# VirtIO-9p mount for cb-conf
declare -gA VM_MOUNTS_9P=(
  [cb_conf]="${PWD}"
)

# Graphical display
VM_DISPLAY="gtk"
VM_VGA="virtio"
VM_SERIAL="mon:stdio"

