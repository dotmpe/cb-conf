# Local cache directory for downloaded seeds (defaults to ~/.cache/vm-seeds)
VM_CACHE_DIR="${VM_CACHE_DIR:-${HOME}/.cache/vm-seeds}"
VM_WORK_DIR="${VM_WORK_DIR:-${PWD}/.vm-work}"
# LAN storage location for disk images
VM_DOC_DIR="/srv/download-29-5/Image"
# Annexed files are symlinks and possibly in remote annex repo
VM_BUP_DIR="/srv/annex-local/archive-1/media/application/disk-image"

# BitTorrent seeding param; netiquette, but not needed for dists w/ online seeds
VM_SEED_RATIO="${VM_SEED_RATIO:-0.0}"
VM_SEED_TIME="${VM_SEED_TIME:-0}" # minutes

# 1. Cloud & OS seed images (fetched remotely via HTTP or BitTorrent, cached locally)
declare -gA VM_SEEDS=(
  [debian-13]="https://cdimage.debian.org/cdimage/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2"
  [debian-12]="https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
  [9front]="http://9front.org/iso/9front-11952.amd64.qcow2.gz.torrent"
)

# 2. Local ISO media (installer or live desktop media)
declare -gA VM_ISOS=(
  [debian-13-netinst]="${VM_DOC_DIR}/debian-13.7.0-amd64-netinst.iso"
  [blboron-1]="${VM_DOC_DIR}/boron-1-240123-amd64.hybrid.iso"
  [blcarbon-1]="${VM_DOC_DIR}/carbon-1-260211-amd64.hybrid.iso"
  [9front-iso]="${VM_DOC_DIR}/9front-release.iso"
)

# 3. Seed format overrides (defaults to qcow2 for seeds, iso/raw for isos)
declare -gA VM_SEED_FORMAT=(
  [debian-13]="qcow2"
  [debian-12]="qcow2"
  [9front]="qcow2"
)
  #[debian-13-genericcloud]="${VM_DOC_DIR}/debian-13-genericcloud-amd64-20261103-2651.qcow2"

